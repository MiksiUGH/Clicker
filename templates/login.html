<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Django Clicker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .auth-card { max-width: 400px; width: 100%; border-radius: 20px; border: 1px solid #eaeaea; }
        .btn-dark-custom { background-color: #141414; border-color: #141414; color: white; border-radius: 8px; }
        .btn-dark-custom:hover { background-color: #333333; border-color: #333333; color: white; }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
        <a class="navbar-brand fw-bold" href="/">CLICKER</a>
        <div class="ms-auto">
            <a href="{% url 'login' %}" class="btn btn-outline-dark btn-sm me-2">Вход</a>
            <a href="{% url 'register' %}" class="btn btn-dark btn-sm">Регистрация</a>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container d-flex justify-content-center align-items-start vh-100 pt-5">
        <div class="card auth-card p-4 shadow-sm bg-white">
            <h3 class="text-center fw-bold mb-4">Авторизация</h3>

            {% if form.errors %}
                <div class="alert alert-danger py-2 small">
                    Неверное имя пользователя или пароль.
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Имя пользователя</label>
                    {{ form.username }}
                </div>
                
                <div class="mb-4">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
                    {{ form.password }}
                </div>

                <button type="submit" class="btn btn-dark-custom w-100 py-2 fw-bold">Войти</button>
            </form>

            <p class="mt-3 text-center mb-0 small">
                Нет аккаунта? <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</body>
</html>
